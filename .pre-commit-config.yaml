# Commit-time secret scanning.
#
# Your LiveKit API key and secret are admin-equivalent for the whole project: together they can
# mint a token carrying any VideoGrants for any room in it, so never commit them. A value that
# reaches a commit is a credential leak for everyone using that project, not just this repo.
# .gitignore already excludes .env; these hooks are the backstop for the other ways a value
# reaches a commit -- a pasted snippet, a captured log, a test fixture.
#
# Install once:  pre-commit install
# Run over everything:  pre-commit run --all-files
#
# Two deliberate choices:
#
#  1. gitleaks scans what is staged, with the default rules plus .gitleaks.toml's allowlist of the test
#     placeholders. Its hook is `language: golang`; pre-commit fetches a Go toolchain to build it where
#     there is none. It is pinned to the commit of a release tag.
#
#  2. gitleaks matches the shapes of secrets, so it can miss a pasted debug log, a positional argument, or
#     a secret quoted in prose -- the shapes that actually leak. scan-staged-for-live-secrets closes that
#     gap by matching the values this machine really has, verbatim, in any shape. It no-ops for anyone
#     without a .env.
#
# detect-private-key runs through `uvx --default-index https://pypi.org/simple`, pinned, so a pip/uv config
# that points at a private index cannot break it, and nothing unpinned runs at commit time.
repos:
  - repo: local
    hooks:
      - id: scan-staged-for-live-secrets
        name: scan staged content for live credential values
        entry: python3 scripts/scan-staged-for-live-secrets.py
        language: system
        pass_filenames: false
        always_run: true

      - id: detect-private-key
        name: scan for private keys
        entry: >-
          uvx --default-index https://pypi.org/simple --from pre-commit-hooks==5.0.0
          detect-private-key
        language: system

      - id: forbid-credential-files
        name: refuse to commit a credentials file
        entry: scripts/forbid-credential-files.sh
        language: script

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
